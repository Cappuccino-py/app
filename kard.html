<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>卡牌对战</title>
<style>
  body { font-family: sans-serif; background: #2c3e50; color: #ecf0f1; margin: 0; padding: 10px; text-align: center; }
  h2 { margin: 10px 0; }
  .board { display: flex; flex-direction: column; height: 90vh; justify-content: space-between; }
  .enemy-area, .player-area { background: #34495e; padding: 10px; border-radius: 10px; min-height: 120px; }
  .mid-area { font-size: 20px; font-weight: bold; margin: 10px 0; }
  .stats { display: flex; justify-content: space-around; margin-bottom: 10px; }
  .hand { display: flex; gap: 10px; justify-content: center; overflow-x: auto; padding: 10px; }
  .card { background: #ecf0f1; color: #2c3e50; width: 80px; height: 110px; border-radius: 8px; display: flex; flex-direction: column; justify-content: center; cursor: pointer; border: 2px solid #bdc3c7; transition: 0.2s; user-select: none; }
  .card:active { transform: scale(0.95); }
  .card .name { font-size: 12px; font-weight: bold; margin-bottom: 5px; }
  .card .stats { font-size: 16px; font-weight: bold; display: flex; justify-content: space-around; }
  .card.atk { color: #e74c3c; }
  .card.hp { color: #27ae60; }
  .card.disabled { opacity: 0.5; cursor: not-allowed; }
  .enemy-board, .player-board { display: flex; gap: 10px; justify-content: center; min-height: 110px; align-items: center; }
  button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 5px; cursor: pointer; margin-top: 10px; }
  .btn-end { background: #e67e22; color: white; }
  .msg { color: #f1c40f; font-weight: bold; margin: 10px 0; }
</style>
</head>
<body>

<div class="board">
  <div class="enemy-area">
    <div class="stats">
      <span>敌方主将 HP: <span id="enemyHp">30</span></span>
    </div>
    <div class="enemy-board" id="enemyBoard"></div>
  </div>

  <div class="mid-area">
    <div class="msg" id="message">你的回合，请出牌</div>
  </div>

  <div class="player-area">
    <div class="player-board" id="playerBoard"></div>
    <div class="stats">
      <span>我方主将 HP: <span id="playerHp">30</span></span>
    </div>
  </div>
</div>

<div class="hand" id="hand"></div>
<button class="btn-end" id="endTurnBtn" onclick="endTurn()" style="display:none;">结束回合</button>

<script>
  // 游戏状态
  let playerHp = 30;
  let enemyHp = 30;
  let playerBoard = [];
  let enemyBoard = [];
  let playerHand = [];
  let turn = 'player'; // 'player' 或 'enemy'

  // 卡牌池（简单属性）
  const cardPool = [
    { name: "步兵", atk: 2, hp: 3 },
    { name: "坦克", atk: 4, hp: 5 },
    { name: "火炮", atk: 6, hp: 2 },
    { name: "侦察兵", atk: 1, hp: 1 }
  ];

  // 随机抽卡
  function drawCard() {
    return { ...cardPool[Math.floor(Math.random() * cardPool.length)], id: Math.random() };
  }

  // 初始化
  function initGame() {
    playerHp = 30; enemyHp = 30;
    playerBoard = []; enemyBoard = []; playerHand = [];
    for (let i = 0; i < 3; i++) playerHand.push(drawCard());
    updateUI();
  }

  // 出牌
  function playCard(index) {
    if (turn !== 'player') return;
    if (playerHand[index]) {
      playerBoard.push(playerHand[index]);
      playerHand.splice(index, 1);
      playerHand.push(drawCard()); // 补一张牌
      updateUI();
    }
  }

  // 玩家攻击
  function attack(playerIndex, enemyIndex) {
    if (turn !== 'player') return;
    let p = playerBoard[playerIndex];
    let e = enemyBoard[enemyIndex];

    // 互相扣血
    e.hp -= p.atk;
    p.hp -= e.atk;

    // 检查死亡
    if (e.hp <= 0) enemyBoard.splice(enemyIndex, 1);
    if (p.hp <= 0) playerBoard.splice(playerIndex, 1);

    updateUI();
  }

  // 结束回合
  function endTurn() {
    if (turn !== 'player') return;
    turn = 'enemy';
    document.getElementById("endTurnBtn").style.display = "none";
    document.getElementById("message").innerText = "敌方回合...";
    setTimeout(enemyTurn, 1000);
  }

  // 敌方逻辑（简单AI）
  function enemyTurn() {
    // 1. 敌方抽牌并出牌
    if (enemyBoard.length < 3) {
      enemyBoard.push(drawCard());
      updateUI();
      setTimeout(enemyTurn, 1000); // 继续出牌或下一步
      return;
    }

    // 2. 敌方攻击（如果有牌）
    if (enemyBoard.length > 0) {
      let target = Math.floor(Math.random() * playerBoard.length);
      let attacker = Math.floor(Math.random() * enemyBoard.length);
      let e = enemyBoard[attacker];
      let p = playerBoard[target];

      if (p) {
        p.hp -= e.atk;
        e.hp -= p.atk;
        if (p.hp <= 0) playerBoard.splice(target, 1);
        if (e.hp <= 0) enemyBoard.splice(attacker, 1);
      } else {
        // 没牌直接打主将
        playerHp -= e.atk;
      }
      updateUI();
      setTimeout(enemyTurn, 1000);
      return;
    }

    // 3. 如果没牌了，结束回合
    turn = 'player';
    document.getElementById("endTurnBtn").style.display = "inline-block";
    document.getElementById("message").innerText = "你的回合，请出牌";
    updateUI();
  }

  // 刷新界面
  function updateUI() {
    // 更新血量
    document.getElementById("playerHp").innerText = playerHp;
    document.getElementById("enemyHp").innerText = enemyHp;

    // 渲染我方手牌
    let handDiv = document.getElementById("hand");
    handDiv.innerHTML = "";
    playerHand.forEach((card, index) => {
      let cardDiv = document.createElement("div");
      cardDiv.className = `card ${turn !== 'player' ? 'disabled' : ''}`;
      cardDiv.innerHTML = `<div class="name">${card.name}</div>
                           <div class="stats"><span class="atk">⚔${card.atk}</span> <span class="hp">❤${card.hp}</span></div>`;
      cardDiv.onclick = () => playCard(index);
      handDiv.appendChild(cardDiv);
    });

    // 渲染我方战场
    let pBoard = document.getElementById("playerBoard");
    pBoard.innerHTML = "";
    playerBoard.forEach((card, index) => {
      let cardDiv = document.createElement("div");
      cardDiv.className = "card";
      cardDiv.innerHTML = `<div class="name">${card.name}</div>
                           <div class="stats"><span class="atk">⚔${card.atk}</span> <span class="hp">❤${card.hp}</span></div>`;
      pBoard.appendChild(cardDiv);
    });

    // 渲染敌方战场
    let eBoard = document.getElementById("enemyBoard");
    eBoard.innerHTML = "";
    enemyBoard.forEach((card, index) => {
      let cardDiv = document.createElement("div");
      cardDiv.className = "card";
      cardDiv.innerHTML = `<div class="name">${card.name}</div>
                           <div class="stats"><span class="atk">⚔${card.atk}</span> <span class="hp">❤${card.hp}</span></div>`;
      eBoard.appendChild(cardDiv);
    });

    // 判断胜负
    if (playerHp <= 0) { setTimeout(() => alert("你输了！"), 100); initGame(); }
    if (enemyHp <= 0) { setTimeout(() => alert("你赢了！"), 100); initGame(); }
  }

  // 开始游戏
  initGame();
</script>
</body>
</html>
