<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>房间对战卡牌</title>
<style>
  body { font-family: sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 15px; text-align: center; }
  h2 { color: #e94560; margin-top: 0; }
  .box { background: #16213e; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
  button { padding: 10px 20px; font-size: 16px; border: none; border-radius: 8px; cursor: pointer; background: #e94560; color: #fff; margin: 5px 0; width: 100%; max-width: 250px; transition: 0.2s; }
  button:active { background: #c0354b; transform: scale(0.98); }
  button:disabled { background: #555; cursor: not-allowed; transform: none; }
  .hidden { display: none !important; }
  .room-item { background: #0f3460; padding: 12px; border-radius: 8px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #e94560; }
  .room-info { text-align: left; font-size: 14px; }
  .room-info .host { font-weight: bold; color: #4ecca3; }
  .room-item button { width: auto; padding: 6px 15px; font-size: 14px; margin: 0; }
  .hp-bar { font-size: 24px; font-weight: bold; color: #4ecca3; margin: 10px 0; }
  .hand { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .card { background: #fff; color: #333; width: 80px; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: 0.2s; }
  .card:active { transform: scale(0.95); }
  .card.disabled { opacity: 0.5; cursor: not-allowed; }
  .card .name { font-size: 14px; }
  .card .atk { font-size: 20px; color: #e74c3c; margin-top: 5px; }
  .logs { background: #0f3460; height: 120px; overflow-y: auto; padding: 10px; text-align: left; font-size: 14px; border-radius: 5px; margin-top: 15px; line-height: 1.5; }
  .log-item { border-bottom: 1px solid #1a1a2e; padding: 5px 0; }
  .vs-text { font-size: 28px; font-weight: bold; color: #e94560; margin: 10px 0; }
  .turn-text { color: #f1c40f; font-weight: bold; margin: 15px 0; font-size: 18px; }
</style>
</head>
<body>

<h2>⚔ 房间对战</h2>

<div class="box" id="lobbyArea">
  <div id="createRoomArea">
    <button onclick="createRoom()">➕ 创建新房间</button>
  </div>

  <h3 style="margin-top:20px; font-size:16px; color:#aaa;">房间列表（点击加入）：</h3>
  <div id="roomList" style="max-height: 300px; overflow-y: auto;">
    <p style="font-size:14px; color:#666;">暂无房间</p>
  </div>
</div>

<div class="box hidden" id="gameArea">
  <div class="hp-bar">敌方血量：<span id="enemyHp">30</span></div>
  <div class="vs-text">VS</div>
  <div class="hp-bar">我方血量：<span id="myHp">30</span></div>
  
  <p id="turnStatus" class="turn-text"></p>
  <div class="hand" id="myHand"></div>
  <div class="logs" id="gameLogs"></div>
  
  <button onclick="exitGame()" style="background:#c0392b; margin-top:15px; width:100%; max-width:100%;">强行退出</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bzhntlpdouhwcbqcdsfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Cwuigqfp_poxrjYjVVtJkQ_klug8TTt";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const myCode = localStorage.getItem("myCode");

let currentRoom = null;
let pollInterval = null;
let lobbyInterval = null;
let isPlayer1 = false;
let myHp = 30, enemyHp = 30, currentTurn = "";

const myCards = [
  { name: "步兵", atk: 2 },
  { name: "坦克", atk: 4 },
  { name: "轰炸机", atk: 6 }
];

// 创建房间
async function createRoom() {
  document.getElementById("createRoomArea").classList.add("hidden");
  const { data, error } = await db.from("game_rooms").insert({
    player1: myCode, player2: "", status: "waiting", hp1: 30, hp2: 30, turn: "player1"
  }).select();
  if (!error && data) {
    currentRoom = data[0];
    isPlayer1 = true;
    enterGame();
  }
}

// 刷新房间列表
async function loadRooms() {
  if (currentRoom) return;
  const { data } = await db.from("game_rooms").select("*").eq("status", "waiting").neq("player1", myCode);
  const list = document.getElementById("roomList");
  if (!data || data.length === 0) {
    list.innerHTML = "<p style='font-size:14px; color:#666;'>暂无房间</p>";
    return;
  }
  list.innerHTML = "";
  data.forEach(r => {
    const div = document.createElement("div");
    div.className = "room-item";
    div.innerHTML = `<div class="room-info"><div class="host">房主：${r.player1}</div></div>
                     <button onclick="joinRoom(${r.id}, '${r.player1}')">加入</button>`;
    list.appendChild(div);
  });
}

// 加入房间
async function joinRoom(roomId, host) {
  const { error } = await db.from("game_rooms").update({
    player2: myCode, status: "playing"
  }).eq("id", roomId).eq("status", "waiting");
  
  if (!error) {
    currentRoom = { id: roomId, player1: host, player2: myCode, status: "playing", hp1: 30, hp2: 30, turn: "player1" };
    isPlayer1 = false;
    enterGame();
  } else {
    alert("房间已满或不存在");
  }
}
    function enterGame() {
    document.getElementById("lobbyArea").classList.add("hidden");
    document.getElementById("gameArea").classList.remove("hidden");
    renderHand();
    document.getElementById("gameLogs").innerHTML = `<div class="log-item">对战开始！对手：${isPlayer1 ? "等待加入" : currentRoom.player1}</div>`;
    
    updateGameState(currentRoom);
    pollInterval = setInterval(pollGame, 2000);
  }

  async function pollGame() {
    if (!currentRoom) return;
    const { data } = await db.from("game_rooms").select("*").eq("id", currentRoom.id);
    if (!data || data.length === 0) { alert("房间已解散"); exitGame(); return; }
    currentRoom = data[0];
    updateGameState(currentRoom);
  }

  function updateGameState(room) {
    if (room.status === "waiting" && isPlayer1) {
      document.getElementById("turnStatus").innerText = "等待对手加入...";
      return;
    }

    myHp = isPlayer1 ? room.hp1 : room.hp2;
    enemyHp = isPlayer1 ? room.hp2 : room.hp1;
    currentTurn = room.turn;
    
    document.getElementById("myHp").innerText = myHp;
    document.getElementById("enemyHp").innerText = enemyHp;

    let isMyTurn = (isPlayer1 && currentTurn === 'player1') || (!isPlayer1 && currentTurn === 'player2');
    const turnText = document.getElementById("turnStatus");
    const cards = document.querySelectorAll(".card");

    if (isMyTurn) {
      turnText.innerText = "你的回合，请出牌！";
      turnText.style.color = "#4ecca3";
      cards.forEach(c => c.classList.remove("disabled"));
    } else {
      turnText.innerText = "敌方回合，等待...";
      turnText.style.color = "#e94560";
      cards.forEach(c => c.classList.add("disabled"));
    }

    if (room.last_action) {
      const logs = document.getElementById("gameLogs");
      if (!logs.innerHTML.includes(room.last_action)) {
        logs.innerHTML += `<div class="log-item">${room.last_action}</div>`;
        logs.scrollTop = logs.scrollHeight;
      }
    }

    if (myHp <= 0) { endGame("你输了！"); }
    if (enemyHp <= 0) { endGame("你赢了！"); }
  }

  function renderHand() {
    const handDiv = document.getElementById("myHand");
    handDiv.innerHTML = "";
    myCards.forEach((c, i) => {
      const div = document.createElement("div");
      div.className = "card disabled";
      div.innerHTML = `<div class="name">${c.name}</div><div class="atk">⚔${c.atk}</div>`;
      div.onclick = () => playCard(i, c.atk, c.name);
      handDiv.appendChild(div);
    });
  }

  async function playCard(index, atk, name) {
    let isMyTurn = (isPlayer1 && currentTurn === 'player1') || (!isPlayer1 && currentTurn === 'player2');
    if (!isMyTurn) return;

    let newHp1 = currentRoom.hp1, newHp2 = currentRoom.hp2;
    if (isPlayer1) newHp2 -= atk; else newHp1 -= atk;

    const actionText = `${myCode} 使用了【${name}】，造成 ${atk} 点伤害！`;
    const nextTurn = isPlayer1 ? 'player2' : 'player1';

    await db.from("game_rooms").update({
      hp1: newHp1, hp2: newHp2, turn: nextTurn, last_action: actionText
    }).eq("id", currentRoom.id);
    
    await pollGame();
  }

  function endGame(msg) {
    clearInterval(pollInterval);
    alert(msg);
    if (currentRoom) db.from("game_rooms").delete().eq("id", currentRoom.id).then(exitGame);
    else exitGame();
  }

  async function exitGame() {
    clearInterval(pollInterval);
    if (currentRoom) await db.from("game_rooms").delete().eq("id", currentRoom.id);
    currentRoom = null;
    document.getElementById("lobbyArea").classList.remove("hidden");
    document.getElementById("gameArea").classList.add("hidden");
    document.getElementById("createRoomArea").classList.remove("hidden");
    loadRooms();
  }

  if (!myCode) {
    alert("请先登录主站！");
    location.href = "index.html";
  } else {
    db.from("game_rooms").delete().eq("player1", myCode).eq("status", "waiting");
    setInterval(loadRooms, 3000);
    loadRooms();
  }
</script>
</body>
</html>
