<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>随机匹配卡牌对战</title>
<style>
  body { font-family: sans-serif; background: #1a1a2e; color: #fff; margin: 0; padding: 15px; text-align: center; }
  h2 { color: #e94560; margin-top: 0; }
  .box { background: #16213e; padding: 20px; border-radius: 10px; margin-bottom: 15px; box-shadow: 0 4px 8px rgba(0,0,0,0.3); }
  button { padding: 12px 24px; font-size: 18px; border: none; border-radius: 8px; cursor: pointer; background: #e94560; color: #fff; margin: 10px 0; width: 80%; max-width: 300px; transition: 0.2s; }
  button:active { background: #c0354b; transform: scale(0.98); }
  button:disabled { background: #555; cursor: not-allowed; transform: none; }
  .hidden { display: none !important; }
  .hp-bar { font-size: 24px; font-weight: bold; color: #4ecca3; margin: 10px 0; }
  .hand { display: flex; justify-content: center; gap: 10px; margin-top: 15px; flex-wrap: wrap; }
  .card { background: #fff; color: #333; width: 90px; padding: 10px; border-radius: 8px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 8px rgba(0,0,0,0.3); transition: 0.2s; }
  .card:active { transform: scale(0.95); }
  .card.disabled { opacity: 0.5; cursor: not-allowed; }
  .card .name { font-size: 14px; }
  .card .atk { font-size: 20px; color: #e74c3c; margin-top: 5px; }
  .logs { background: #0f3460; height: 120px; overflow-y: auto; padding: 10px; text-align: left; font-size: 14px; border-radius: 5px; margin-top: 15px; line-height: 1.5; }
  .log-item { border-bottom: 1px solid #1a1a2e; padding: 5px 0; }
  .vs-text { font-size: 28px; font-weight: bold; color: #e94560; margin: 20px 0; }
  .waiting-text { color: #f1c40f; font-size: 16px; margin: 15px 0; animation: blink 1.5s infinite; }
  @keyframes blink { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }
</style>
</head>
<body>

<h2>⚔ 随机匹配对战</h2>

<!-- 匹配区 -->
<div class="box" id="matchArea">
  <p style="color:#aaa;">点击下方按钮，系统会自动为你寻找对手。</p>
  <button id="matchBtn" onclick="startMatch()">开始匹配</button>
  <div id="waitingText" class="waiting-text hidden">正在寻找对手...</div>
  <button id="cancelBtn" class="hidden" style="background:#555; margin-top:10px; font-size:14px; padding:8px 16px;" onclick="cancelMatch()">取消匹配</button>
</div>

<!-- 游戏区 -->
<div class="box hidden" id="gameArea">
  <div class="hp-bar">敌方血量：<span id="enemyHp">30</span></div>
  <div class="vs-text">VS</div>
  <div class="hp-bar">我方血量：<span id="myHp">30</span></div>
  
  <p id="turnStatus" style="color:#f1c40f; font-weight:bold; margin: 15px 0;"></p>

  <div class="hand" id="myHand"></div>
  <div class="logs" id="gameLogs"></div>
  
  <button onclick="exitGame()" style="background:#c0392b; margin-top:15px; font-size:16px;">强行退出</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://bzhntlpdouhwcbqcdsfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Cwuigqfp_poxrjYjVVtJkQ_klug8TTt";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const myCode = localStorage.getItem("myCode");

let currentRoom = null;
let pollInterval = null;
let matchInterval = null;
let isPlayer1 = false;
let myHp = 30, enemyHp = 30, currentTurn = "";

const myCards = [
  { name: "步兵", atk: 2 },
  { name: "坦克", atk: 4 },
  { name: "轰炸机", atk: 6 }
];

// 开始匹配
async function startMatch() {
  document.getElementById("matchBtn").classList.add("hidden");
  document.getElementById("waitingText").classList.remove("hidden");
  document.getElementById("cancelBtn").classList.remove("hidden");

  // 先看看有没有人在等待
  const { data: rooms } = await db.from("game_rooms").select("*")
    .eq("status", "waiting").order("created_at", { ascending: true }).limit(1);

  if (rooms && rooms.length > 0 && rooms[0].player1 !== myCode) {
    // 加入别人的房间
    const room = rooms[0];
    const { error } = await db.from("game_rooms").update({
      player2: myCode,
      status: "playing"
    }).eq("id", room.id);

    if (!error) {
      currentRoom = { ...room, player2: myCode, status: "playing" };
      isPlayer1 = false;
      enterGame();
      return;
    }
  }

  // 如果没人，自己建一个房间
  const { data, error } = await db.from("game_rooms").insert({
    player1: myCode,
    status: "waiting",
    hp1: 30, hp2: 30,
    turn: "player1"
  }).select();

  if (error) { alert("创建房间失败"); return; }
  currentRoom = data[0];
  isPlayer1 = true;

  // 自己建了房间后，开始死循环等别人进来
  matchInterval = setInterval(checkMatchStatus, 2000);
}

// 检查自己的房间有没有人进来
async function checkMatchStatus() {
  if (!currentRoom) return;
  const { data } = await db.from("game_rooms").select("*").eq("id", currentRoom.id);
  if (data && data.length > 0) {
    if (data[0].status === "playing") {
      clearInterval(matchInterval);
      currentRoom = data[0];
      enterGame();
    }
  }
}

// 取消匹配
async function cancelMatch() {
  clearInterval(matchInterval);
  if (currentRoom && isPlayer1) {
    await db.from("game_rooms").delete().eq("id", currentRoom.id);
  }
  currentRoom = null;
  document.getElementById("matchBtn").classList.remove("hidden");
  document.getElementById("waitingText").classList.add("hidden");
  document.getElementById("cancelBtn").classList.add("hidden");
}
  
function enterGame() {
  document.getElementById("matchArea").classList.add("hidden");
  document.getElementById("gameArea").classList.remove("hidden");
  renderHand();
  
  document.getElementById("gameLogs").innerHTML = `<div class="log-item">对战开始！</div>`;
  updateGameState(currentRoom);
  pollInterval = setInterval(pollGame, 2000);
}

async function pollGame() {
  if (!currentRoom) return;
  const { data } = await db.from("game_rooms").select("*").eq("id", currentRoom.id);
  
  // 如果房间被删了（对方强行退出）
  if (!data || data.length === 0) {
    alert("对方已退出，游戏结束");
    exitGame();
    return;
  }
  
  currentRoom = data[0];
  updateGameState(currentRoom);
}

function updateGameState(room) {
  myHp = isPlayer1 ? room.hp1 : room.hp2;
  enemyHp = isPlayer1 ? room.hp2 : room.hp1;
  currentTurn = room.turn;
  
  document.getElementById("myHp").innerText = myHp;
  document.getElementById("enemyHp").innerText = enemyHp;

  let isMyTurn = (isPlayer1 && currentTurn === 'player1') || (!isPlayer1 && currentTurn === 'player2');
  const turnText = document.getElementById("turnStatus");
  const cards = document.querySelectorAll(".card");

  if (isMyTurn) {
    turnText.innerText = "你的回合，请出牌！";
    turnText.style.color = "#4ecca3";
    cards.forEach(c => c.classList.remove("disabled"));
  } else {
    turnText.innerText = "敌方回合，等待...";
    turnText.style.color = "#e94560";
    cards.forEach(c => c.classList.add("disabled"));
  }

  if (room.last_action) {
    const logs = document.getElementById("gameLogs");
    // 防止重复追加最后一条
    if (logs.lastElementChild && logs.lastElementChild.innerText === room.last_action) {
       // 一样就不加了
    } else {
      logs.innerHTML += `<div class="log-item">${room.last_action}</div>`;
      logs.scrollTop = logs.scrollHeight;
    }
  }

  if (myHp <= 0) { endGame("你输了！"); }
  if (enemyHp <= 0) { endGame("你赢了！"); }
}
  
function renderHand() {
  const handDiv = document.getElementById("myHand");
  handDiv.innerHTML = "";
  myCards.forEach((c, i) => {
    const div = document.createElement("div");
    div.className = "card disabled"; // 初始默认禁用
    div.innerHTML = `<div class="name">${c.name}</div><div class="atk">⚔${c.atk}</div>`;
    div.onclick = () => playCard(i, c.atk, c.name);
    handDiv.appendChild(div);
  });
}

async function playCard(index, atk, name) {
  let isMyTurn = (isPlayer1 && currentTurn === 'player1') || (!isPlayer1 && currentTurn === 'player2');
  if (!isMyTurn) { alert("还没轮到你！"); return; }

  let newHp1 = currentRoom.hp1;
  let newHp2 = currentRoom.hp2;

  if (isPlayer1) newHp2 -= atk;
  else newHp1 -= atk;

  const actionText = `${myCode} 使用了【${name}】，造成 ${atk} 点伤害！`;
  const nextTurn = isPlayer1 ? 'player2' : 'player1';

  const { error } = await db.from("game_rooms").update({
    hp1: newHp1,
    hp2: newHp2,
    turn: nextTurn,
    last_action: actionText
  }).eq("id", currentRoom.id);

  if (error) { alert("出牌失败，请重试"); return; }
  
  await pollGame(); // 立即刷新
}

function endGame(msg) {
  clearInterval(pollInterval);
  alert(msg);
  
  // 结束游戏，删掉房间
  if (currentRoom) {
    db.from("game_rooms").delete().eq("id", currentRoom.id).then(() => {
      exitGame();
    });
  } else {
    exitGame();
  }
}

async function exitGame() {
  clearInterval(pollInterval);
  if (currentRoom) {
    await db.from("game_rooms").delete().eq("id", currentRoom.id);
  }
  currentRoom = null;
  document.getElementById("matchArea").classList.remove("hidden");
  document.getElementById("gameArea").classList.add("hidden");
  document.getElementById("matchBtn").classList.remove("hidden");
  document.getElementById("waitingText").classList.add("hidden");
  document.getElementById("cancelBtn").classList.add("hidden");
  document.getElementById("gameLogs").innerHTML = "";
}
  
  // 启动检查
  if (!myCode) {
    alert("请先登录主站！");
    location.href = "index.html";
  } else {
    // 主动清理可能因为断网残留的旧房间
    db.from("game_rooms").delete().eq("player1", myCode).eq("status", "waiting");
  }
</script>
</body>
</html>
