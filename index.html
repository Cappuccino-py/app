<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>主页</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; padding: 12px; background: #fff; }
  h1 { text-align: center; font-size: 20px; }
  .post-box { background: #fff; padding: 12px; border-radius: 10px;
              margin-bottom: 12px; border: 1px solid #eee; }
  textarea { width: 100%; height: 70px; padding: 10px; font-size: 16px;
             border: 1px solid #ddd; border-radius: 8px; resize: none; }
  button.post-btn { width: 100%; padding: 10px; margin-top: 8px; font-size: 16px;
                    background: #4a90e2; color: #fff; border: none; border-radius: 8px; }
  .post { background: #fff; padding: 12px; border-radius: 10px;
          margin-bottom: 10px; border: 1px solid #eee; }
  .post .head { display: flex; align-items: center; gap: 8px; }
  .post .head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; }
  .post .head .name { font-weight: bold; font-size: 15px; }
  .post .head .code { color: #999; font-size: 12px; }
  .post .content { font-size: 16px; line-height: 1.5; margin-top: 8px; white-space: pre-wrap; }
  .post .time { font-size: 12px; color: #999; margin-top: 6px; }
  .post .actions { margin-top: 8px; display: flex; gap: 16px; align-items: center; }
  .like-btn, .cmt-btn { background: none; border: none; font-size: 15px;
              display: flex; align-items: center; gap: 4px; cursor: pointer; padding: 0; }
  .heart { font-size: 18px; }
  .like-btn.liked .heart { color: #e74c3c; }
  .overlay { position: fixed; inset: 0; background: #fff; z-index: 10;
             display: none; flex-direction: column; padding: 12px; overflow-y: auto; }
  .overlay.show { display: flex; }
  .overlay .close { font-size: 22px; background: none; border: none;
                    text-align: left; padding: 4px; cursor: pointer; }
  .cmt-item { padding: 10px 0; border-bottom: 1px solid #eee; }
  .cmt-item .head { display: flex; align-items: center; gap: 6px; }
  .cmt-item .head img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; }
  .cmt-item .head .name { font-size: 14px; font-weight: bold; }
  .cmt-item .head .code { font-size: 11px; color: #999; }
  .cmt-item .body { font-size: 15px; margin-top: 4px; }
  .cmt-item .actions { margin-top: 4px; display: flex; gap: 14px; font-size: 13px; color: #666; }
  .cmt-item .actions button { background: none; border: none; font-size: 13px;
                              color: #666; cursor: pointer; padding: 0; }
  .cmt-form { display: flex; gap: 6px; margin-top: 12px; }
  .cmt-form input { flex: 1; padding: 10px; font-size: 15px;
                    border: 1px solid #ccc; border-radius: 8px; }
  .cmt-form button { padding: 10px 16px; font-size: 15px; background: #4a90e2;
                     color: #fff; border: none; border-radius: 8px; }
</style>
</head>
<body>

<h1>主页</h1>

<div class="post-box">
  <textarea id="content" placeholder="分享点什么..."></textarea>
  <button class="post-btn" onclick="postIt()">发布</button>
</div>

<div id="list">加载中...</div>

<div class="overlay" id="overlay">
  <button class="close" onclick="closeComments()">✕</button>
  <div id="cmtPost"></div>
  <div id="cmtList"></div>
  <div class="cmt-form">
    <input id="cmtInput" placeholder="写评论...">
    <button onclick="sendComment()">发送</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://bzhntlpdouhwcbqcdsfj.supabase.co";
const SUPABASE_KEY = "sb_publishable_Cwuigqfp_poxrjYjVVtJkQ_klug8TTt";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const myCode = localStorage.getItem("myCode");
if (!myCode) { alert("请先注册"); location.href = "login.html"; }

let currentPostId = null;
let userMap = {};

async function loadPosts() {
  const { data: posts, error } = await db.from("posts").select("*").order("created_at", { ascending: false });
  const box = document.getElementById("list");
  if (error) { box.innerText = "加载失败：" + error.message; return; }
  if (!posts || posts.length === 0) { box.innerText = "还没有帖子"; return; }

  const { data: users } = await db.from("users").select("*");
  userMap = {};
  (users || []).forEach(u => userMap[u.code] = u);

  const { data: likes } = await db.from("likes").select("*");
  const { data: comments } = await db.from("comments").select("*");

  box.innerHTML = "";
  posts.forEach(p => {
    const u = userMap[p.user_code] || { nickname: "未知", avatar: "" };
    const postLikes = (likes || []).filter(l => l.post_id === p.id);
    const likedByMe = postLikes.some(l => l.user_code === myCode);
    const cmtCount = (comments || []).filter(c => c.post_id === p.id).length;

    const div = document.createElement("div");
    div.className = "post";
    div.innerHTML = `
      <div class="head">
        <img src="${u.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2236%22 height=%2236%22%3E%3Crect fill=%22%23ddd%22 width=%2236%22 height=%2236%22/%3E%3C/svg%3E'}">
        <div>
          <div class="name">${u.nickname}</div>
          <div class="code">${p.user_code}</div>
        </div>
      </div>
      <div class="content">${escapeHtml(p.content)}</div>
      <div class="time">${new Date(p.created_at + "Z").toLocaleString("zh-CN", { timeZone: "Asia/Shanghai" })}</div>
      <div class="actions">
        <button class="like-btn ${likedByMe ? 'liked' : ''}" onclick="toggleLike(${p.id}, ${likedByMe})">
          <span class="heart">${likedByMe ? '❤️' : '🤍'}</span>
          <span>${postLikes.length}</span>
        </button>
        <button class="cmt-btn" onclick="openComments(${p.id})">
          💬 <span>${cmtCount}</span>
        </button>
        ${p.user_code === myCode ? `<button class="cmt-btn" onclick="delPost(${p.id})">... </button>` : ""}
      </div>
    `;
    box.appendChild(div);
  });
}

async function toggleLike(postId, liked) {
  if (liked) await db.from("likes").delete().eq("post_id", postId).eq("user_code", myCode);
  else await db.from("likes").insert({ post_id: postId, user_code: myCode });
  loadPosts();
}
 
async function openComments(postId) {
  currentPostId = postId;
  document.getElementById("overlay").classList.add("show");

  const { data: posts } = await db.from("posts").select("*").eq("id", postId);
  const p = posts[0];
  const u = userMap[p.user_code] || { nickname: "未知", avatar: "" };
  document.getElementById("cmtPost").innerHTML = `
    <div class="post">
      <div class="head">
        <img src="${u.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2236%22 height=%2236%22%3E%3Crect fill=%22%23ddd%22 width=%2236%22 height=%2236%22/%3E%3C/svg%3E'}">
        <div>
          <div class="name">${u.nickname}</div>
          <div class="code">${p.user_code}</div>
        </div>
      </div>
      <div class="content">${escapeHtml(p.content)}</div>
    </div>`;

  await loadComments();
}

async function loadComments() {
  const { data: comments } = await db.from("comments").select("*")
    .eq("post_id", currentPostId).order("created_at", { ascending: true });
  const box = document.getElementById("cmtList");
  if (!comments || comments.length === 0) { box.innerHTML = "<p style='color:#999'>还没有评论</p>"; return; }
  box.innerHTML = "";
  comments.forEach(c => {
    const u = userMap[c.user_code] || { nickname: "未知", avatar: "" };
    const div = document.createElement("div");
    div.className = "cmt-item";
    div.innerHTML = `
      <div class="head">
        <img src="${u.avatar || 'data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2228%22 height=%2228%22%3E%3Crect fill=%22%23ddd%22 width=%2228%22 height=%2228%22/%3E%3C/svg%3E'}">
        <div>
          <div class="name">${u.nickname}</div>
          <div class="code">${c.user_code}</div>
        </div>
      </div>
      <div class="body">${escapeHtml(c.content)}</div>
      <div class="actions">
        ${c.user_code === myCode ? `<button onclick="delComment(${c.id})">删除</button>` : ""}
      </div>
    `;
    box.appendChild(div);
  });
}

async function sendComment() {
  const content = document.getElementById("cmtInput").value.trim();
  if (!content) return;
  const { error } = await db.from("comments").insert({
    post_id: currentPostId, user_code: myCode, content: content
  });
  if (error) { alert("评论失败：" + error.message); return; }
  document.getElementById("cmtInput").value = "";
  await loadComments();
}

async function delComment(id) {
  await db.from("comments").delete().eq("id", id);
  await loadComments();
}

function closeComments() {
  document.getElementById("overlay").classList.remove("show");
  currentPostId = null;
  loadPosts();
}

async function delPost(id) {
  if (!confirm("确定删除这条帖子？")) return;
  const { error } = await db.from("posts").delete().eq("id", id);
  if (error) { alert("删除失败：" + error.message); return; }
  loadPosts();
}

async function postIt() {
  const content = document.getElementById("content").value.trim();
  if (!content) { alert("写点什么吧"); return; }
  const { error } = await db.from("posts").insert({ user_code: myCode, content: content });
  if (error) { alert("发布失败：" + error.message); return; }
  document.getElementById("content").value = "";
  loadPosts();
}

function escapeHtml(s) {
  return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

loadPosts();
</script>
</body>
</html>
