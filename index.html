<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小破站</title>
<link rel="manifest" href="manifest.json">
<style>
  :root { --bg: #fff; --fg: #000; --card: #fff; --border: #eee; --gray: #999; }
  .dark { --bg: #111; --fg: #eee; --card: #1c1c1c; --border: #333; --gray: #888; }
  * { box-sizing: border-box; }
  body { font-family: sans-serif; margin: 0; padding: 12px; background: var(--bg); color: var(--fg); }
  h1 { text-align: center; font-size: 20px; margin: 8px 0; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; }
  .top-bar .icon-btn { font-size: 22px; background: none; border: none; cursor: pointer; color: var(--fg); }
  .post-box { background: var(--card); padding: 12px; border-radius: 10px;
              margin-bottom: 12px; border: 1px solid var(--border); }
  textarea { width: 100%; height: 70px; padding: 10px; font-size: 16px;
             border: 1px solid var(--border); border-radius: 8px; resize: none;
             background: var(--card); color: var(--fg); }
  input[type=text], input[type=url], input[type=password], input[type=email] {
    width: 100%; padding: 10px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); color: var(--fg); margin-top: 6px; }
  button.post-btn { width: 100%; padding: 10px; margin-top: 8px; font-size: 16px;
                    background: #4a90e2; color: #fff; border: none; border-radius: 8px; }
  .post { background: var(--card); padding: 12px; border-radius: 10px;
          margin-bottom: 10px; border: 1px solid var(--border); }
  .post .head { display: flex; align-items: center; gap: 8px; }
  .post .head img { width: 36px; height: 36px; border-radius: 50%; object-fit: cover; cursor: pointer; }
  .post .head .name { font-weight: bold; font-size: 15px; cursor: pointer; }
  .post .head .code { color: var(--gray); font-size: 12px; }
  .admin-tag { font-size: 11px; background: #f1c40f; color: #000;
               padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
  .mod-tag { font-size: 11px; background: #3498db; color: #fff;
             padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
  .guest-tag { font-size: 11px; background: var(--border); color: var(--gray);
               padding: 1px 6px; border-radius: 8px; margin-left: 4px; }
  .post .content { font-size: 16px; line-height: 1.5; margin-top: 8px; white-space: pre-wrap; }
  .post .content img { max-width: 100%; border-radius: 8px; margin-top: 8px; display: block; }
  .post .content .vlink { color: #4a90e2; word-break: break-all; }
  .post .time { font-size: 12px; color: var(--gray); margin-top: 6px; }
  .post .actions { margin-top: 8px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  .like-btn, .cmt-btn { background: none; border: none; font-size: 15px;
              display: flex; align-items: center; gap: 4px; cursor: pointer;
              padding: 0; color: var(--fg); }
  .heart { font-size: 18px; }
  .like-btn.liked .heart { color: #e74c3c; }
  
.notice-modal { position: fixed; inset: 0; background: rgba(0,0,0,.5);
                z-index: 9999; display: none; align-items: center; justify-content: center; }
.notice-modal.show { display: flex; }
.notice-box { background: var(--card); color: var(--fg); border-radius: 14px;
              padding: 24px; width: 80%; max-width: 320px; text-align: center; }
.notice-box h3 { margin: 0 0 12px; }
.notice-box p { font-size: 14px; color: var(--gray); margin: 6px 0; line-height: 1.6; }
.notice-box button { margin-top: 16px; padding: 10px 30px; border: none;
                     border-radius: 20px; background: #4a90e2; color: #fff; font-size: 15px; }

.overlay { position: fixed; inset: 0; background: var(--bg); color: var(--fg); z-index: 10;
           display: none; flex-direction: column; padding: 12px; overflow-y: auto; }
.overlay.show { display: flex; }
.overlay .close { font-size: 22px; background: none; border: none;
                  text-align: left; padding: 4px; cursor: pointer; color: var(--fg); }
.cmt-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
.cmt-item .head { display: flex; align-items: center; gap: 6px; }
.cmt-item .head img { width: 28px; height: 28px; border-radius: 50%; object-fit: cover; cursor: pointer; }
.cmt-item .head .name { font-size: 14px; font-weight: bold; cursor: pointer; }
.cmt-item .head .code { font-size: 11px; color: var(--gray); }
.cmt-item .body { font-size: 15px; margin-top: 4px; }
.cmt-item .actions { margin-top: 4px; display: flex; gap: 14px; font-size: 13px; color: var(--gray); }
.cmt-item .actions button { background: none; border: none; font-size: 13px;
                            color: var(--gray); cursor: pointer; padding: 0; }
.cmt-item .actions .liked { color: #e74c3c; }
.cmt-form { display: flex; gap: 6px; margin-top: 12px; }
.cmt-form input { flex: 1; padding: 10px; font-size: 15px;
                  border: 1px solid var(--border); border-radius: 8px;
                  background: var(--card); color: var(--fg); }
.cmt-form button { padding: 10px 16px; font-size: 15px; background: #4a90e2;
                   color: #fff; border: none; border-radius: 8px; }

.sidebar { position: fixed; top: 0; left: 0; bottom: 0; width: 260px;
           background: var(--card); color: var(--fg); z-index: 20;
           box-shadow: 2px 0 10px rgba(0,0,0,.1);
           transform: translateX(-100%); transition: .2s; padding: 16px; overflow-y: auto; }
.sidebar.show { transform: translateX(0); }
.sidebar .profile { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
.sidebar .profile img { width: 50px; height: 50px; border-radius: 50%; object-fit: cover; }
.sidebar .profile .name { font-weight: bold; font-size: 16px; }
.sidebar .profile .code { color: var(--gray); font-size: 12px; }
.sidebar .menu-item { padding: 12px 4px; font-size: 16px; cursor: pointer;
                      border-bottom: 1px solid var(--border); position: relative; }
.sidebar .menu-item .badge { position: absolute; right: 8px; top: 12px;
                             background: #e74c3c; color: #fff; font-size: 11px;
                             padding: 2px 7px; border-radius: 10px; }
.mask { position: fixed; inset: 0; background: rgba(0,0,0,.3); z-index: 15; display: none; }
.mask.show { display: block; }
  
  .search-page { position: fixed; inset: 0; background: var(--bg); color: var(--fg); z-index: 30;
                 display: none; flex-direction: column; padding: 12px; overflow-y: auto; }
  .search-page.show { display: flex; }
  .search-bar { display: flex; gap: 6px; }
  .search-bar input { flex: 1; padding: 10px; font-size: 15px;
                      border: 1px solid var(--border); border-radius: 8px;
                      background: var(--card); color: var(--fg); margin-top: 0; }
  .search-bar button { padding: 10px 16px; font-size: 15px; background: #4a90e2;
                       color: #fff; border: none; border-radius: 8px; }
  .hist-head { display: flex; justify-content: space-between; align-items: center;
               margin-top: 14px; color: var(--gray); font-size: 13px; }
  .hist-item { padding: 8px 0; border-bottom: 1px solid var(--border);
               display: flex; justify-content: space-between; cursor: pointer; }
  .card { display: flex; align-items: center; gap: 10px; padding: 10px 0;
          border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .card img { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; cursor: pointer; }
  .card .info { flex: 1; cursor: pointer; min-width: 100px; }
  .card .info .name { font-weight: bold; font-size: 15px; }
  .card .info .code { color: var(--gray); font-size: 12px; }
  .card button { padding: 6px 10px; font-size: 12px; border: none;
                 border-radius: 16px; cursor: pointer; margin-left: 4px; }
  .card .follow { background: #4a90e2; color: #fff; }
  .card .unfollow { background: var(--border); color: var(--fg); }
  .card .addfriend { background: #2ecc71; color: #fff; }
  .card .already { background: var(--border); color: var(--gray); }
  .card .grant { background: #f1c40f; color: #000; }
  .card .revoke { background: #e67e22; color: #fff; }

  .login-page { position: fixed; inset: 0; background: var(--bg); color: var(--fg); z-index: 40;
                display: none; flex-direction: column; padding: 20px; justify-content: center;
                overflow-y: auto; }
  .login-page.show { display: flex; }
  .login-page h2 { text-align: center; }
  .login-page input { width: 100%; padding: 12px; font-size: 16px;
                      border: 1px solid var(--border); border-radius: 8px;
                      margin-bottom: 12px; background: var(--card); color: var(--fg); margin-top: 0; }
  .login-page button { width: 100%; padding: 12px; font-size: 16px; background: #4a90e2;
                       color: #fff; border: none; border-radius: 8px; margin-bottom: 10px; }
  .login-page .guest-btn { background: #888; }

  .announce-page { position: fixed; inset: 0; background: var(--bg); color: var(--fg); z-index: 48;
                   display: none; flex-direction: column; padding: 12px; overflow-y: auto; }
  .announce-page.show { display: flex; }
  .announce-page h2 { text-align: center; }
</style>
</head>
<body>
  
<div class="notice-modal" id="noticeModal">
  <div class="notice-box">
    <h3>👋 欢迎来到小破站</h3>
    <p>没广告、没算法、不卖东西。</p>
    <p>可以发帖、吐槽、聊天，还能匿名。</p>
    <p>人不多，但自由。</p>
    <p>想说话，就注册一下，30 秒。</p>
    <button onclick="closeNotice()">知道了</button>
  </div>
</div>

<div class="top-bar">
  <button class="icon-btn" onclick="openSidebar()">⚙️</button>
  <h1 style="flex:1;text-align:center;margin:0;">小破站</h1>
  <button class="icon-btn" onclick="refreshAll()">🔄</button>
  <button class="icon-btn" onclick="openSearch()">🔍</button>
</div>

<div class="post-box">
  <textarea id="content" placeholder="分享点什么..."></textarea>
  <input type="text" id="postVideo" placeholder="视频链接（选填，B站/YouTube等）">
  <input type="file" id="postImage" accept="image/*" style="margin-top:8px;">
  <button class="post-btn" onclick="postIt()">发布</button>
</div>

<div id="list">加载中...</div>

<div class="overlay" id="overlay">
  <button class="close" onclick="closeComments()">✕</button>
  <div id="cmtPost"></div>
  <div id="cmtList"></div>
  <div class="cmt-form">
    <input id="cmtInput" placeholder="写评论...">
    <button onclick="sendComment()">发送</button>
  </div>
</div>

<div class="mask" id="mask" onclick="closeSidebar()"></div>
<div class="sidebar" id="sidebar">
  <div class="profile">
    <img id="sideAvatar" src="">
    <div>
      <div class="name" id="sideName"></div>
      <div class="code" id="sideCode"></div>
    </div>
  </div>
  <div class="menu-item" onclick="goHome()">🏠 主页</div>
  <div class="menu-item" onclick="openAnnounce()">📢 公告</div>
  <div class="menu-item" onclick="showMyPosts()">查看</div>
  <div class="menu-item" onclick="showMyFavs()">收藏</div>
  <div class="menu-item" onclick="showFollowing()">关注<span id="followBadge" class="badge" style="display:none">0</span></div>
  <div class="menu-item" onclick="openFocus()">🎯 专注</div>
  <div class="menu-item" onclick="toggleTheme()">界面</div>
  <div class="menu-item" onclick="openSettings()">设置</div>
  <div class="menu-item" onclick="openMessages()">消息<span id="msgBadge" class="badge" style="display:none">0</span></div>
  <div class="menu-item" id="adminMenu" style="display:none" onclick="openAdminPanel()">管理</div>
  <div class="menu-item" id="notifyMenu" style="display:none" onclick="openNotify()">通知<span id="notifyBadge" class="badge" style="display:none">0</span></div>
  <div class="menu-item" id="fbMenu" style="display:none" onclick="openFeedback()">用户反馈<span id="fbBadge" class="badge" style="display:none">0</span></div>
  <div class="menu-item" style="color:#c62828" onclick="logout()">退出登录</div>
</div>

<div class="search-page" id="searchPage">
  <button class="close" onclick="closeSearch()">✕</button>
  <div class="search-bar">
    <input id="searchInput" placeholder="搜名字或编码...">
    <button onclick="doSearch()">搜索</button>
  </div>
  <div class="hist-head">
    <span>搜索历史</span>
    <button style="background:none;border:none;color:var(--gray);cursor:pointer;" onclick="clearHistory()">🗑️ 全部删除</button>
  </div>
  <div id="historyList"></div>
  <div id="searchResult"></div>
</div>

<div class="login-page" id="loginPage">
  <h2>欢迎</h2>
  <button onclick="location.href='login.html'">去注册</button>
  <p style="text-align:center;color:#999;font-size:14px">或</p>
  <input id="loginCode" placeholder="输入你的编码登录，如 #5956">
  <input id="loginPwd" type="password" placeholder="密码">
  <button onclick="doLogin()">登录</button>
  <button class="guest-btn" onclick="guestLogin()">游客模式进入</button>
</div>

<div class="announce-page" id="announcePage">
  <button class="close" onclick="closeAnnounce()">✕</button>
  <h2>📢 公告</h2>
  <div id="announceForm" style="display:none">
    <textarea id="announceContent" placeholder="发公告..."></textarea>
    <button class="post-btn" onclick="postAnnounce()">发布公告</button>
  </div>
  <div id="announceList"></div>
</div>

<div class="settings-page" id="settingsPage" style="position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:45;display:none;flex-direction:column;padding:16px;overflow-y:auto">
  <button class="close" onclick="closeSettings()">✕</button>
  <h2>设置</h2>
  <img id="setAvatar" style="width:80px;height:80px;border-radius:50%;object-fit:cover;display:block;margin:10px auto;">
  <label style="font-size:14px;color:var(--gray);margin-top:12px;display:block">头像（从相册上传）</label>
  <input type="file" id="setAvatarFile" accept="image/*">
  <label style="font-size:14px;color:var(--gray);margin-top:12px;display:block">名字</label>
  <input id="setName" maxlength="20">
  <label style="font-size:14px;color:var(--gray);margin-top:12px;display:block">性别</label>
  <select id="setGender">
    <option value="">不选</option>
    <option value="男">男</option>
    <option value="女">女</option>
  </select>
  <label style="font-size:14px;color:var(--gray);margin-top:12px;display:block">个人介绍（最多 50 字，选填）</label>
  <textarea id="setBio" maxlength="50"></textarea>
  <label style="font-size:14px;color:var(--gray);margin-top:12px;display:block">新密码（不填则不修改，最少 6 位）</label>
  <input id="setPwd" type="password" placeholder="新密码">
  <label style="font-size:14px;color:var(--gray);margin-top:12px;display:block">新邮箱（不填则不修改）</label>
  <input type="email" id="setEmail" placeholder="新邮箱">
  <label style="font-size:14px;color:var(--gray);margin-top:12px;display:block">邮箱验证码</label>
  <input type="text" id="setEmailCode" placeholder="6 位验证码">
  <button type="button" onclick="sendCodeForEmail()" style="background:#888;padding:10px;border:none;border-radius:8px;color:#fff;font-size:14px;margin-top:6px;">发送验证码</button>
  <button class="save-btn" style="background:#4a90e2;color:#fff;padding:12px;border:none;border-radius:8px;margin-top:20px;font-size:16px;width:100%" onclick="saveSettings()">保存</button>
  <label style="font-size:14px;color:var(--gray);margin-top:12px;display:block">向站长反馈</label>
  <textarea id="fbContent" maxlength="200" placeholder="有什么想说的..."></textarea>
  <button class="save-btn" style="background:#9b59b6;color:#fff;padding:12px;border:none;border-radius:8px;margin-top:20px;font-size:16px;width:100%" onclick="sendFeedback()">提交反馈</button>
  <button class="del-btn" style="background:#c62828;color:#fff;padding:12px;border:none;border-radius:8px;margin-top:30px;font-size:16px;width:100%" onclick="deleteAccount()">删除账号</button>
</div>

<div class="messages-page" id="messagesPage" style="position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:50;display:none;flex-direction:column;padding:12px;overflow-y:auto">
  <button class="close" onclick="closeMessages()">✕</button>
  <h2 style="text-align:center;margin:8px 0">消息</h2>
  <div class="tab-row" style="display:flex;gap:6px;margin:10px 0">
    <div id="tabReq" class="active" style="flex:1;text-align:center;padding:8px;border-radius:8px;background:#4a90e2;color:#fff;cursor:pointer" onclick="switchMsgTab('req')">好友申请</div>
    <div id="tabChat" style="flex:1;text-align:center;padding:8px;border-radius:8px;background:var(--border);cursor:pointer" onclick="switchMsgTab('chat')">私信</div>
  </div>
  <div id="msgList"></div>
</div>

<div class="chat-page" id="chatPage" style="position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:55;display:none;flex-direction:column">
  <div class="chat-head" style="display:flex;align-items:center;gap:8px;padding:10px;border-bottom:1px solid var(--border);flex-wrap:wrap">
    <button style="font-size:14px;background:none;border:none;cursor:pointer;color:var(--fg);padding:4px 8px" onclick="closeChat()">←</button>
    <span id="chatName"></span>
    <button style="font-size:14px;background:none;border:none;cursor:pointer;color:var(--fg);padding:4px 8px" onclick="unfriend()">删除好友</button>
    <button style="font-size:14px;color:#c62828;background:none;border:none;cursor:pointer;padding:4px 8px" onclick="blockUser()">拉黑</button>
    <button style="font-size:14px;background:none;border:none;cursor:pointer;color:var(--fg);padding:4px 8px" onclick="clearLocalChat()">清空</button>
  </div>
  <div class="chat-body" id="chatBody" style="flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px"></div>
  <div class="chat-input" style="display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)">
    <label for="chatImage" style="padding:8px;font-size:20px;cursor:pointer">🖼️</label>
    <input type="file" id="chatImage" accept="image/*" style="display:none">
    <input type="text" id="chatText" placeholder="说点什么..." style="flex:1;padding:10px;font-size:15px;border:1px solid var(--border);border-radius:20px;background:var(--card);color:var(--fg);margin-top:0">
    <button style="padding:8px 14px;font-size:15px;background:#4a90e2;color:#fff;border:none;border-radius:20px" onclick="sendChat()">发送</button>
  </div>
</div>

<div class="profile-card" id="profileCard" style="position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:var(--card);color:var(--fg);border-radius:14px;padding:24px;z-index:60;text-align:center;width:300px;box-shadow:0 4px 20px rgba(0,0,0,.25);display:none;max-height:80vh;overflow-y:auto">
  <img id="pcAvatar" src="" style="width:80px;height:80px;border-radius:50%;object-fit:cover">
  <div class="name" id="pcName" style="font-weight:bold;font-size:18px;margin-top:10px"></div>
  <div class="code" id="pcCode" style="color:var(--gray);font-size:13px;margin-top:4px"></div>
  <div class="gender" id="pcGender" style="color:var(--gray);font-size:13px;margin-top:4px"></div>
  <div class="bio" id="pcBio" style="margin-top:12px;font-size:14px;line-height:1.6;color:var(--gray);padding:0 8px"></div>
  <div class="btns" style="display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap">
    <button id="pcFollowBtn" class="follow" style="padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:14px;background:#4a90e2;color:#fff">关注</button>
    <button id="pcFriendBtn" class="addfriend" style="padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:14px;background:#2ecc71;color:#fff">加好友</button>
    <button id="pcAdminBtn" class="grant" style="display:none;padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:14px;background:#f1c40f;color:#000">设为管理员</button>
    <button class="close-btn" style="padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:14px;background:var(--border);color:var(--fg)" onclick="closeProfile()">退出</button>
  </div>
</div>

<div class="admin-page" id="adminPage" style="position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:65;display:none;flex-direction:column;padding:16px;overflow-y:auto">
  <button class="close" onclick="closeAdminPanel()">✕</button>
  <h2 style="text-align:center">管理</h2>
  <h4>已授权管理员</h4>
  <div id="adminList"></div>
</div>

<div class="admin-page" id="notifyPage" style="position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:65;display:none;flex-direction:column;padding:16px;overflow-y:auto">
  <button class="close" onclick="closeNotify()">✕</button>
  <h2 style="text-align:center">通知</h2>
  <div id="notifyList"></div>
</div>

<div class="profile-card" id="feedbackPanel" style="width:320px;text-align:left">
  <h3 style="text-align:center;margin-top:0">用户反馈</h3>
  <div id="feedbackList"></div>
  <div class="btns" style="display:flex;gap:8px;justify-content:center;margin-top:16px">
    <button class="close-btn" style="padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:14px;background:var(--border);color:var(--fg)" onclick="closeFeedback()">关闭</button>
  </div>
</div>

<div class="admin-page" id="focusPage" style="position:fixed;inset:0;background:var(--bg);color:var(--fg);z-index:65;display:none;flex-direction:column;padding:16px;overflow-y:auto">
  <button class="close" onclick="closeFocus()">✕</button>
  <h2 style="text-align:center">🎯 学习专注</h2>
  <div style="text-align:center;padding:20px">

async function loadFocusData() {

  const today = new Date().toISOString().slice(0, 10);
  const todayMins = (data || []).filter(d => d.date === today).reduce((a, b) => a + b.minutes, 0);
  const totalCredits = (data || []).reduce((a, b) => a + Math.floor(b.minutes / 10), 0);
  document.getElementById("todayFocus").innerText = todayMins;
  document.getElementById("credits").innerText = totalCredits;

function toggleFocus() {
  const btn = document.getElementById("focusBtn");
  if (!focusRunning) {
    focusRunning = true;
    btn.innerText = "暂停";
    btn.style.background = "#e67e22";
    focusInterval = setInterval(() => {
      focusSeconds++;
      const h = String(Math.floor(focusSeconds / 3600)).padStart(2, "0");
      const m = String(Math.floor((focusSeconds % 3600) / 60)).padStart(2, "0");
      const s = String(focusSeconds % 60).padStart(2, "0");
      document.getElementById("focusTimer").innerText = `${h}:${m}:${s}`;
    }, 1000);
  } else {
    focusRunning = false;
    btn.innerText = "开始";
    btn.style.background = "#4a90e2";
    clearInterval(focusInterval);
    saveFocusTime();
  }
}

async function saveFocusTime() {

  const minutes = Math.floor(focusSeconds / 60);
  const today = new Date().toISOString().slice(0, 10);
  await db.from("focus_logs").insert({ user_code: myCode, date: today, minutes: minutes });
  focusSeconds = 0;
  document.getElementById("focusTimer").innerText = "00:00:00";

}

      <div class="time">${new Date(p.created_at + "Z").toLocaleString("zh-CN", { timeZone: "Asia/Shanghai" })}</div>
      <div class="actions">
        <button class="like-btn ${likedByMe ? 'liked' : ''}" onclick="${isGuest ? 'alert(\"游客不能点赞\")' : `toggleLike(${p.id}, ${likedByMe})`}">
          <span class="heart">${likedByMe ? '❤️' : '🤍'}</span><span>${postLikes.length}</span>
        </button>
        <button class="cmt-btn" onclick="openComments(${p.id})">💬 <span>${cmtCount}</span></button>
        <button class="cmt-btn" onclick="${isGuest ? 'alert(\"游客不能收藏\")' : `toggleFav(${p.id}, ${favedByMe})`}">${favedByMe ? '⭐' : '☆'}</button>
        ${canDel ? `<button class="cmt-btn" onclick="delPost(${p.id})">... </button>` : ""}
        ${isAdmin ? `<button class="cmt-btn" onclick="toggleHide(${p.id}, ${!!p.hidden})">${p.hidden ? '显示' : '隐藏'}</button>` : ""}
      </div>
    `;
    box.appendChild(div);
  });
}
</script>
</body>
</html>
